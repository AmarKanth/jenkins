apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.database.deployment.name }}
spec:
  replicas: {{ .Values.database.deployment.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Values.database.label.app }}
  template:
    metadata:
      labels:
        app: {{ .Values.database.label.app }}
    spec:
      containers:
      - name: {{ .Values.database.container.name }}
        image: "{{ .Values.database.container.image.repository }}:{{ .Values.database.container.image.tag }}"
        imagePullPolicy: {{ .Values.database.container.image.pullPolicy }}
        ports:
        - containerPort: {{ .Values.database.container.port }}
        envFrom:
        - configMapRef:
            name: postgres-config
        volumeMounts:
        - name: {{ .Values.database.container.volume.name }}
          mountPath: {{ .Values.database.container.volume.mountPath }}
      volumes:
      - name: {{ .Values.database.container.volume.name }}
        hostPath:
          path: {{ .Values.database.container.volume.hostPath }}
          type: {{ .Values.database.container.volume.type }}

---

apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.database.service.name }}
  labels:
    app: {{ .Values.database.label.app }}
spec:
  type: {{ .Values.database.service.type }}
  selector:
    app: {{ .Values.database.label.app }}
  ports:
  - protocol: TCP
    port: {{ .Values.database.service.port }}
    targetPort: {{ .Values.database.service.port }}